<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Lucky Draw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#F9F1D8',
                            200: '#F0DEAA',
                            300: '#E6CB7D',
                            400: '#DDB850',
                            500: '#D4A523',
                            600: '#AA841C',
                            700: '#806315',
                        },
                        navy: {
                            800: '#0F172A',
                            900: '#020617',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'shine': 'shine 2s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        shine: {
                            '0%': { backgroundPosition: '200% center' },
                            '100%': { backgroundPosition: '-200% center' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .premium-shadow {
            box-shadow: 0 0 40px rgba(212, 165, 35, 0.15);
        }

        .grid-cell-animate {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Custom Scrollbar for history if needed */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-4 text-white selection:bg-gold-500 selection:text-navy-900">

    <!-- Background Elements -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div
            class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px] mix-blend-screen animate-pulse-slow">
        </div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-gold-500/10 rounded-full blur-[120px] mix-blend-screen animate-pulse-slow"
            style="animation-delay: 1s;"></div>
    </div>

    <div class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-2 gap-8 relative z-10">

        <!-- Left Panel: The Stage -->
        <div
            class="glass-panel rounded-3xl p-8 flex flex-col items-center justify-between min-h-[500px] relative overflow-hidden group">

            <!-- Header -->
            <div class="w-full flex justify-between items-start mb-8">
                <div>
                    <h1
                        class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-white to-slate-400">
                        Lucky Draw
                    </h1>
                    <p id="pool-size-text" class="text-slate-400 text-sm font-medium mt-1 tracking-wide">
                        30 Candidates
                    </p>
                </div>
                <div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full">
                    <span id="remaining-count" class="text-gold-400 font-bold font-mono">30</span>
                    <span class="text-xs text-slate-500 uppercase tracking-widest ml-1">Left</span>
                </div>
            </div>

            <!-- The Sphere -->
            <div class="relative flex-1 flex items-center justify-center w-full my-4">
                <div id="ball-container" class="relative w-64 h-64 flex items-center justify-center">
                    <!-- Outer Glows -->
                    <div class="absolute inset-0 bg-gold-500/20 rounded-full blur-3xl scale-75 animate-pulse-slow">
                    </div>

                    <!-- The Ball -->
                    <div id="ball"
                        class="relative w-56 h-56 rounded-full bg-gradient-to-br from-slate-800 to-black border border-white/10 shadow-2xl flex items-center justify-center z-10 transition-all duration-500 transform hover:scale-105">

                        <!-- Inner Shadows & Highlights for 3D effect -->
                        <div
                            class="absolute inset-0 rounded-full bg-gradient-to-tr from-black/80 via-transparent to-white/10">
                        </div>
                        <div
                            class="absolute top-4 left-8 w-16 h-8 bg-white/10 blur-md rounded-full transform -rotate-12">
                        </div>

                        <!-- Number Display -->
                        <span id="main-display"
                            class="relative text-8xl font-black text-transparent bg-clip-text bg-gradient-to-b from-gold-200 to-gold-600 drop-shadow-sm z-20 font-mono">
                            ?
                        </span>
                    </div>

                    <!-- Orbital Rings (Decorative) -->
                    <div
                        class="absolute inset-0 border border-white/5 rounded-full scale-125 animate-[spin_10s_linear_infinite]">
                    </div>
                    <div
                        class="absolute inset-0 border border-white/5 rounded-full scale-110 animate-[spin_15s_linear_infinite_reverse]">
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="w-full grid grid-cols-4 gap-4 mt-8">
                <button id="reset-btn"
                    class="col-span-1 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-white flex items-center justify-center transition-all duration-200 group/reset"
                    aria-label="Reset">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="text-slate-400 group-hover/reset:text-white transition-colors group-hover/reset:-rotate-180 duration-500">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                </button>

                <button id="draw-btn"
                    class="col-span-3 h-16 rounded-2xl bg-gradient-to-r from-gold-500 to-gold-400 hover:from-gold-400 hover:to-gold-300 text-navy-900 font-bold text-lg shadow-[0_0_20px_rgba(212,165,35,0.3)] hover:shadow-[0_0_30px_rgba(212,165,35,0.5)] transition-all duration-300 transform active:scale-[0.98] flex items-center justify-center gap-3 overflow-hidden relative">
                    <div
                        class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent w-1/2 -skew-x-12 translate-x-[-150%] animate-shine">
                    </div>
                    <span class="relative z-10 flex items-center gap-2">
                        DRAW NUMBER
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14" />
                            <path d="m12 5 7 7-7 7" />
                        </svg>
                    </span>
                </button>
            </div>
        </div>

        <!-- Right Panel: History -->
        <div class="glass-panel rounded-3xl p-8 flex flex-col">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-sm font-bold uppercase tracking-widest text-slate-500">Results Board</h2>
                <div class="h-1 w-12 bg-gold-600 rounded-full"></div>
            </div>

            <!-- Grid -->
            <div id="grid-container"
                class="flex-1 grid grid-cols-5 gap-3 content-start overflow-y-auto pr-2 custom-scrollbar">
                <!-- Cells will be injected here -->
            </div>

            <!-- Footer Stats -->
            <div class="mt-6 pt-6 border-t border-white/5 flex justify-between text-xs text-slate-500 font-mono">
                <span>TOTAL: 30</span>
                <span>DRAWN: <span id="drawn-count" class="text-white">0</span></span>
            </div>
        </div>

    </div>

    <script>
        // --- Configuration ---
        const TOTAL_NUMBERS = 20;
        const SHIFT = 41

        // --- State ---
        let pool = Array.from({ length: TOTAL_NUMBERS }, (_, i) => i + SHIFT);
        let drawn = [];
        let isAnimating = false;

        // --- DOM Elements ---
        const els = {
            mainDisplay: document.getElementById('main-display'),
            // ball: document.getElementById('ball'), // Not actively manipulated for logic, just CSS
            remainingCount: document.getElementById('remaining-count'),
            drawnCount: document.getElementById('drawn-count'),
            gridContainer: document.getElementById('grid-container'),
            drawBtn: document.getElementById('draw-btn'),
            resetBtn: document.getElementById('reset-btn'),
            poolSizeText: document.getElementById('pool-size-text'),
        };

        // --- Initialization ---
        function init() {
            renderGrid();
            updateStats();

            // Add click handlers
            els.drawBtn.addEventListener('click', handleDraw);
            els.resetBtn.addEventListener('click', handleReset);

            // Set initial text
            els.poolSizeText.innerText = `${TOTAL_NUMBERS} Candidates`;
        }

        // --- Core Logic ---
        function handleDraw() {
            if (isAnimating || pool.length === 0) return;

            isAnimating = true;
            toggleInteractive(false);

            // Animation sequence
            let duration = 0;
            const maxDuration = 1500; // 1.5s shuffle
            const intervalTime = 60;

            const shuffleInterval = setInterval(() => {
                const randomNum = pool[Math.floor(Math.random() * pool.length)];
                els.mainDisplay.innerText = randomNum;
                // Add a little shake/blur effect via class if desired, or let CSS handle it
                duration += intervalTime;

                if (duration >= maxDuration) {
                    clearInterval(shuffleInterval);
                    finalizeDraw();
                }
            }, intervalTime);
        }

        function finalizeDraw() {
            // Pick winner
            const randomIndex = Math.floor(Math.random() * pool.length);
            const winner = pool[randomIndex];

            // Update State
            pool.splice(randomIndex, 1);
            drawn.push(winner);

            // Update UI
            els.mainDisplay.innerText = winner;
            updateStats();
            renderGrid(winner); // Pass winner to highlight it

            isAnimating = false;

            // Check if game over
            if (pool.length === 0) {
                toggleInteractive(false);
                els.drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
                els.drawBtn.innerHTML = '<span class="relative z-10">COMPLETED</span>';
            } else {
                toggleInteractive(true);
            }
        }

        function handleReset() {
            if (isAnimating) return;
            if (!confirm('Start a new round?')) return;

            pool = Array.from({ length: TOTAL_NUMBERS }, (_, i) => i + SHIFT);
            drawn = [];
            els.mainDisplay.innerText = '?';

            // Reset Button State
            els.drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            els.drawBtn.innerHTML = `
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent w-1/2 -skew-x-12 translate-x-[-150%] animate-shine"></div>
                <span class="relative z-10 flex items-center gap-2">
                    DRAW NUMBER
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </span>
            `;

            updateStats();
            renderGrid();
        }

        // --- UI Functions ---
        function toggleInteractive(active) {
            els.drawBtn.style.pointerEvents = active ? 'auto' : 'none';
            els.resetBtn.style.pointerEvents = active ? 'auto' : 'none';
            els.drawBtn.style.filter = active ? 'none' : 'grayscale(0.5)';
        }

        function updateStats() {
            els.remainingCount.innerText = pool.length;
            els.drawnCount.innerText = drawn.length;
        }

        function renderGrid(justDrawnNum = null) {
            els.gridContainer.innerHTML = '';

            // We want to show numbers 1 to 30
            // Drawn numbers are highlighted.
            // justDrawnNum gets a special pop effect.

            const allNumbers = Array.from({ length: TOTAL_NUMBERS }, (_, i) => i + SHIFT);

            allNumbers.forEach(num => {
                const isDrawn = drawn.includes(num);
                const isJustDrawn = num === justDrawnNum;

                const cell = document.createElement('div');
                cell.className = `
                    grid-cell-animate aspect-square rounded-xl flex items-center justify-center text-sm font-bold border transition-all duration-500
                    ${isJustDrawn
                        ? 'bg-gold-500 text-navy-900 border-gold-400 scale-110 shadow-[0_0_15px_rgba(212,165,35,0.6)] z-10'
                        : isDrawn
                            ? 'bg-slate-700/50 text-slate-400 border-slate-600'
                            : 'bg-white/5 text-slate-300 border-white/10 hover:bg-white/10'
                    }
                `;
                cell.innerText = num;
                els.gridContainer.appendChild(cell);
            });
        }

        // Run
        init();
    </script>
</body>

</html>
